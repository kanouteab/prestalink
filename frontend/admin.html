<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin PrestaLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="prestalink-dashboard.css">
    <link rel="stylesheet" href="assets/css/admin-dashboard.css">
</head>
<body class="admin-dashboard-page">
<div class="admin-shell">
    <aside class="admin-sidebar">
        <div>
            <h1>PrestaLink Admin</h1>
            <p id="adminIdentity">Administrateur</p>
        </div>
        <nav>
            <button type="button" onclick="loadAdminHome()">Accueil admin</button>
            <button type="button" onclick="loadAdminBanners()">Bannière d'accueil</button>
            <button type="button" onclick="loadAdminBranding()">Branding</button>
            <button type="button" onclick="loadAdminUsers()">Utilisateurs</button>
            <button type="button" onclick="loadAdminPublications()">Publications</button>
            <button type="button" onclick="loadAdminReports()">Signalements</button>
            <button type="button" onclick="loadAdminStats()">Statistiques</button>
        </nav>
        <button class="btn btn-outline-light" type="button" onclick="logoutAdmin()">Déconnexion</button>
    </aside>
    <main class="admin-main">
        <header class="admin-main-header">
            <div>
                <h2>Tableau de bord administrateur</h2>
                <p>Gestion séparée des accès administrateur.</p>
            </div>
        </header>
        <section id="dynamicView"></section>
    </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/dashboard/state.js"></script>
<script src="assets/js/dashboard/utils.js"></script>
<script src="assets/js/branding.js"></script>
<script src="assets/js/dashboard/admin-banners.js"></script>
<script src="assets/js/dashboard/admin-branding.js"></script>
<script src="assets/js/admin-dashboard.js"></script>
<script>
    initializeAdminDashboard();
</script>
</body>
</html>
