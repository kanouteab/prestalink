<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion admin - PrestaLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/admin-dashboard.css">
</head>
<body class="admin-auth-page">
<main class="admin-login-shell">
    <section class="admin-login-panel">
        <h1>Administration PrestaLink</h1>
        <form id="adminLoginForm">
            <div class="mb-3">
                <label class="form-label" for="adminEmail">Email administrateur</label>
                <input class="form-control" id="adminEmail" type="email" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="adminPassword">Mot de passe</label>
                <input class="form-control" id="adminPassword" type="password" autocomplete="current-password" required>
            </div>
            <div class="admin-login-error" id="adminLoginError"></div>
            <button class="btn btn-primary w-100" type="submit">Se connecter</button>
        </form>
        <div class="admin-recovery-links">
            <button type="button" class="btn btn-link p-0" onclick="showAdminRecoveryPanel('adminForgotPasswordPanel')">
                Mot de passe oublié ?
            </button>
            <button type="button" class="btn btn-link p-0" onclick="showAdminRecoveryPanel('adminFindEmailPanel')">
                Email oublié ?
            </button>
        </div>
        <div id="adminForgotPasswordPanel" class="admin-recovery-panel d-none">
            <h2>Réinitialiser le mot de passe</h2>
            <input class="form-control mb-2" id="adminForgotEmail" type="text" placeholder="Email ou identifiant">
            <button class="btn btn-primary w-100 mb-2" type="button" onclick="requestAdminPasswordReset()">Envoyer le lien</button>
            <input class="form-control mb-2" id="adminResetToken" type="text" placeholder="Code de réinitialisation">
            <input class="form-control mb-2" id="adminNewPassword" type="password" placeholder="Nouveau mot de passe">
            <input class="form-control mb-2" id="adminConfirmNewPassword" type="password" placeholder="Confirmer le mot de passe">
            <button class="btn btn-primary w-100" type="button" onclick="resetAdminPassword()">Réinitialiser le mot de passe</button>
            <div class="admin-login-error" id="adminPasswordRecoveryMessage"></div>
        </div>
        <div id="adminFindEmailPanel" class="admin-recovery-panel d-none">
            <h2>Retrouver mon compte</h2>
            <input class="form-control mb-2" id="adminFindUsername" type="text" placeholder="Identifiant administrateur">
            <input class="form-control mb-2" id="adminFindFullName" type="text" placeholder="Nom complet">
            <button class="btn btn-primary w-100" type="button" onclick="findAdminEmail()">Retrouver mon compte</button>
            <div class="admin-login-error" id="adminEmailRecoveryMessage"></div>
        </div>
    </section>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/dashboard/state.js"></script>
<script src="assets/js/branding.js"></script>
<script src="assets/js/admin-dashboard.js"></script>
<script>
    document.getElementById("adminLoginForm").addEventListener("submit", handleAdminLogin);
</script>
</body>
</html>
